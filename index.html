<style>
/* Layout: one centred CRT-style screen holding the pitch, a difficulty row above it, key legend below, and a thumb pad that only appears on touch devices. Committed dark look, single theme. */
:root{
  --ink:#0c0c22; --panel:#16163d; --edge:#3a3a8c; --paper:#efeccf; --dim:#8f8fc4;
  --home:#ffd400; --away:#ff4a3d; --grass:#1c9a3e;
  --display:'Silkscreen','Courier New',monospace;
  --mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:14px;line-height:1.5;
  padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,34px);letter-spacing:.06em;line-height:1;color:var(--home);text-wrap:balance}
h1 span{color:var(--away)}
.tag{margin:6px 0 0;color:var(--dim);font-size:13px}
.diff{display:flex;gap:6px;flex-wrap:wrap}
.diff button{
  font:700 11px/1 var(--display);letter-spacing:.08em;color:var(--dim);background:var(--panel);
  border:2px solid var(--edge);padding:9px 12px;cursor:pointer;
}
.diff button[aria-pressed="true"]{color:var(--ink);background:var(--home);border-color:var(--home)}
.diff button:focus-visible,.pad button:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.screen{position:relative;border:3px solid var(--edge);background:#000;line-height:0;touch-action:manipulation}
.screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px);
}
canvas{display:block;width:100%;aspect-ratio:3/2;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0;padding:0;list-style:none;color:var(--dim);font-size:13px}
.legend li{display:flex;align-items:center;gap:8px;min-width:0}
kbd{font:500 12px/1 var(--mono);color:var(--paper);background:var(--panel);border:1px solid var(--edge);border-bottom-width:3px;padding:4px 7px}
.pad{display:none;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 16px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad button{
  font:700 18px/1 var(--display);color:var(--paper);background:var(--panel);border:2px solid var(--edge);
  width:58px;height:58px;touch-action:none;-webkit-tap-highlight-color:transparent;
}
.pad button.on{background:var(--home);color:var(--ink);border-color:var(--home)}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.pad .kick{width:104px;height:104px;font-size:15px;letter-spacing:.08em;border-color:var(--away);color:var(--away)}
.pad .kick.on{background:var(--away);color:var(--ink);border-color:var(--away)}
.fsbtn{font:700 11px/1 var(--display);letter-spacing:.08em;color:var(--dim);background:var(--panel);border:2px solid var(--edge);padding:9px 12px;cursor:pointer}
html:fullscreen body{padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
html:fullscreen .wrap{max-width:none;width:100%;gap:6px}
html:fullscreen header,html:fullscreen .legend{display:none}
html:fullscreen .screen{border-width:0;width:min(100vw,150vh);margin:0 auto}
@media (pointer:coarse){html:fullscreen .screen{width:min(100vw,calc((100vh - 200px)*1.5))}}
.nbx{position:fixed;inset:0;background:rgba(5,5,20,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.nbx[hidden]{display:none}
.nb{background:var(--panel);border:3px solid var(--edge);max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto;line-height:1.35}
.nb h3{margin:0;font:700 16px/1 var(--display);color:var(--home);letter-spacing:.06em}
.nb p{margin:0;font-size:13px;color:var(--paper)}
.nb textarea{width:100%;min-height:78px;resize:vertical;background:var(--ink);color:var(--paper);border:2px solid var(--edge);font:12px/1.3 var(--mono);padding:8px;word-break:break-all}
.nb .row{display:flex;gap:8px;flex-wrap:wrap}
.nb button{font:700 11px/1 var(--display);letter-spacing:.08em;color:var(--paper);background:var(--ink);border:2px solid var(--edge);padding:10px 14px;cursor:pointer}
.nb button:disabled{opacity:.4;cursor:default}
.nb .st{color:var(--dim);font-size:12px;min-height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pad .lob{width:70px;height:70px;font-size:13px;letter-spacing:.06em;color:var(--home);border-color:var(--home)}
.pad .lob.on{background:var(--home);color:var(--ink)}
@media (pointer:coarse){.pad{display:flex}.legend .kb{display:none}}
.pad[hidden]{display:none!important}
.nb [hidden]{display:none!important}
body.noxb .xb{display:none!important}
body.obm .pad .lob{display:none!important}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px}
.pad button{width:calc(58px*var(--bs,1));height:calc(58px*var(--bs,1))}
.pad .kick{width:calc(104px*var(--bs,1));height:calc(104px*var(--bs,1))}
.pad .lob{width:calc(70px*var(--bs,1));height:calc(70px*var(--bs,1))}
body.joy .dpad{display:none}
body.lefty .pad{flex-direction:row-reverse}
@media (pointer:coarse) and (orientation:landscape){body.lefty .pad{justify-content:flex-end}}
canvas{touch-action:none}
body{overscroll-behavior:none}
.rot{display:none;margin:0;color:var(--dim);font-size:12px;text-align:center}
#joy{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid rgba(255,255,255,.38);background:rgba(255,255,255,.07);display:none;pointer-events:none;z-index:9}
#joy i{position:absolute;left:30px;top:30px;width:36px;height:36px;border-radius:50%;background:rgba(255,212,0,.65)}
@media (pointer:coarse) and (orientation:portrait){.rot{display:block}}
@media (pointer:coarse) and (orientation:landscape){
  body{padding:0}
  .wrap{max-width:none;gap:0}
  header{position:fixed;top:4px;right:6px;z-index:5;gap:4px}
  header>div:first-child{display:none}
  .diff button{padding:6px 8px;opacity:.7}
  .screen{display:grid;place-items:center;height:100vh;height:100dvh}
  canvas{width:min(100vw,calc(100dvh*1.5))}
  .legend,.rot{display:none}
  .pad{position:fixed;left:0;right:0;bottom:6px;flex-wrap:nowrap;padding:0 max(10px,env(safe-area-inset-left,0px));pointer-events:none;z-index:4;opacity:.6;align-items:flex-end}
  .pad>*{pointer-events:auto}
  .acts{max-width:60vw}
  .pad{justify-content:flex-end}
  .pad button{width:calc(46px*var(--bs,1));height:calc(46px*var(--bs,1));font-size:11px}
  .pad .kick{width:calc(76px*var(--bs,1));height:calc(76px*var(--bs,1))}
  .pad .lob{width:calc(50px*var(--bs,1));height:calc(50px*var(--bs,1));font-size:10px}
  .screen{border:0!important;box-shadow:none!important}
}
@media (max-width:420px){.dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}.pad button{width:52px;height:52px}.pad .kick{width:96px;height:96px}.pad .lob{width:58px;height:58px}}
@media (prefers-reduced-motion:reduce){.screen::after{display:none}}
#boss{position:fixed;inset:0;z-index:999;background:#fff center/cover no-repeat;color:#222;overflow:hidden;font:12px Arial,Helvetica,sans-serif}
#boss[hidden]{display:none}
#boss table{border-collapse:collapse;width:100%}
#boss td,#boss th{border:1px solid #d0d0d0;padding:2px 6px;white-space:nowrap}
#boss th{background:#f1f1f1;font-weight:400;color:#555}
#boss .bt{padding:8px 12px;border-bottom:1px solid #ccc;background:#f8f8f8;font-size:13px}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>KICKOFF <span>6128</span></h1>
      <p class="tag">Five-a-side football. Open MENU, then INSTRUCTIONS, to learn the controls.</p>
    </div>
    <div class="diff"><button type="button" id="menubtn">MENU</button><button type="button" class="fsbtn" id="fsbtn">FULLSCREEN</button></div>
  </header>

  <div class="screen"><canvas id="c" width="1920" height="1280" aria-label="Football pitch seen from a raised angle, you play in yellow against red"></canvas></div>
  <p class="sr" id="sr" aria-live="polite"></p>

  <div class="pad" aria-label="Touch controls">
    <div class="dpad">
      <button type="button" class="u" data-k="u" aria-label="Up">&#9650;</button>
      <button type="button" class="l" data-k="l" aria-label="Left">&#9664;</button>
      <button type="button" class="r" data-k="r" aria-label="Right">&#9654;</button>
      <button type="button" class="d" data-k="d" aria-label="Down">&#9660;</button>

function grTr(t){

  if(m=/^ALL SQUARE! (.+) ARE BACK IN IT$/.exec(t))return 'ΙΣΟΠΑΛΙΑ! '+gt(m[1])+' - ΞΑΝΑ ΣΤΟ ΠΑΙΧΝΙΔΙ';
  if(m=/^IT IS A ROUT FOR (.+)$/.exec(t))return 'ΣΥΝΤΡΙΒΗ ΓΙΑ '+gt(m[1]);
  if(m=/^(.+) RUNNING RIOT!$/.exec(t))return gt(m[1])+' - ΧΩΡΙΣ ΦΡΕΝΑ!';
  if(m=/^(.+) TAKE THE LEAD!$/.exec(t))return gt(m[1])+' - ΠΑΙΡΝΕΙ ΤΟ ΠΡΟΝΟΜΙΟ!';
  if(m=/^WHAT A FINISH BY (.+)!$/.exec(t))return 'ΤΙ ΤΕΛΕΙΩΜΑ! '+gt(m[1]);
  if(m=/^GOAL FOR (.+)!$/.exec(t))return 'ΓΚΟΛ! '+gt(m[1]);

  return null;
}

function gkDistribute(hk,ax,ay){

  const d0=dist(hk,best);

}

function swTick(){
  const w=S.sw;if(!w||S.mode!=='play'||S.paused||S.replay||S.warp||S.menu.length)return;
  const d=S.dog;
  if(!d){
    if(w.paused){S.pause=Math.min(S.pause,25);w.paused=false}
    for(const a of w.a){a.vx=a.x<CX?-1.2:1.2;a.vy=0;a.x+=a.vx;a.an+=.35;a.fx=Math.sign(a.vx)}
    w.a=w.a.filter(a=>a.x>X0-24&&a.x<X1+24);if(!w.a.length)S.sw=null;
    return;
  }
  w.t++;
  if(w.t===150&&!w.a.length){
    const sx=d.x<CX?X1+8:X0-8;
    for(let i=0;i<2;i++)w.a.push({x:sx,y:i?Y1-2:Y0+6,vx:0,vy:0,fx:sx>CX?-1:1,fy:0,an:0,tm:2,i:i+3,gk:false,stw:true,cd:0,lunge:0,dive:null,th:0,tc:0,jz:0});

    if(!S.pause&&!S.sp&&!S.after&&!S.pso&&!S.tr){S.pause=1800;S.after=null;w.paused=true;whistle();S.lost=S.lost||0}
  }
  if(S.pause>0&&w.paused)dogStep();
  for(const a of w.a){
    const dx=d.x-a.x,dy=d.y-a.y,L=Math.hypot(dx,dy)||1;
    a.vx=dx/L*1.1;a.vy=dy/L*1.1;a.x+=a.vx;a.y+=a.vy;a.an+=.35;a.fx=dx/L;a.fy=dy/L;
    if(L<4.5&&!d.caught){
      if(d.kind===2){d.caught=1;d.vx=0;d.vy=0;S.msg='STEWARDS ESCORT THE FAN OFF';S.msgT=120;say('THE FAN IS ESCORTED OFF BY STEWARDS')}

      [660,880,990].forEach((fr,i)=>setTimeout(()=>beep(fr,.08,'square',.04),i*90));
      break;
    }
  }
}
function dogStep(){

      S.invDone=true;
      const kind=O.inv===5?1+Math.floor(Math.random()*4):O.inv,l=Math.random()<.5,I=INV[kind];
      S.dog=d={kind,x:l?X0-6:X1+6,y:rnd(Y0+10,Y1-6),vx:(l?1:-1)*I.vx,vy:0,t:0,bk:0,ty:rnd(Y0+10,Y1-6)};
      S.msg=I.msg;S.msgT=100;sr.textContent=I.msg.toLowerCase();S.sw={t:0,a:[],paused:false};
      if(kind===1)for(let i=0;i<3;i++)setTimeout(()=>beep(900-i*60,.07,'square',.04),i*120);
      else if(kind===2)for(let i=0;i<4;i++)setTimeout(()=>beep(500+i*140,.06,'square',.04),i*90);
      else if(kind===3)for(let i=0;i<3;i++)setTimeout(()=>beep(620+i*40,.08,'sawtooth',.04),i*100);
      else beep(880,.06,'triangle',.04);
    }
    return;
  }
  const I=INV[d.kind];

  if(d.carry){
    if(S.owner||S.sp||S.pause>0&&false){d.carry=false;d.bk=60}
    else{ball.x=d.x;ball.y=d.y;ball.z=2;ball.vx=ball.vy=ball.vz=0;ball.sp=0}
  }
  if(d.kind===2){
    if(d.caught){
      d.caught++;

      ball.vx=ball.vy=ball.vz=0;ball.sp=0;S.owner=null;return;
    }
    if(d.kind===1){ball.vx=d.vx*1.5+rnd(-.6,.6);ball.vy=rnd(-1.8,1.8);S.msg='WOOF!';beep(220,.09,'sawtooth',.05)}

    ball.sp=0;S.owner=null;S.msgT=40;
  }

    fullTime();return;
  }

  for(const p of players){p.dst=(p.dst||0)+Math.hypot(p.vx||0,p.vy||0);if(p.cd>0)p.cd--;if(p.tc>0)p.tc--;if(p.ev>0)p.ev--;if(p.boost>0)p.boost--;if(p.skc>0)p.skc--;if(p.fool>0)p.fool--}
  if(S.msgT>0)S.msgT--;

  if(S.hm>=0&&!S.tr&&!S.pso&&!S.pause&&(S.t%1500===700||((S.cr||0)>.85&&S.t%900===300)))chantFx();
  if(S.pause>0){
    S.pause--;if(!S.tr&&!S.pso)S.lost=(S.lost||0)+1;for(const h of HU)h.latch=false;
    if(S.msg==='GOAL!'){
      for(const p of players)if(p.tm===S.scorer)p.an+=.6;
    }
    if(S.pause===0&&S.after){const f=S.after;S.after=null;f()}
    return;
  }
  if(++S.clock>=S.halfLen){if(S.addT==null)stopSet();if(S.clock>=S.halfLen+S.addT){S.addT=null;S.addB=null;S.lost=0;S.varN=0;endHalf();return}}
  if(O.inj&&!S.sp&&Math.random()<.00002){const tp=players.find(q=>!q.gk&&q.st!=null&&q.st<.3);if(tp)injure(tp,1)}
  for(const p of players)if(p.stutK&&--p.stutK.t<=0){const a=p.stutK.a;p.stutK=null;p.stutDone=1;kickBall(p,a[0],a[1],a[2],a[3],a[4])}

 ['MOVING AND KICKING','Arrows or WASD move. Space: hold to charge, release to kick. Steer sideways as you release to curl the ball. C passes to the teammate you face. Space with the ball in the air jumps for a header. Space without the ball is a slide tackle; slide tackles from behind are fouls.'],

 ['SKILLS AND TIME WARP','Skill move (V): steer sideways for a step-over that beats tackles, straight for a knock-on and sprint, next to a ball in the air for a volley. Steer backwards for a DRAG BACK turn, or diagonally backwards for a ROULETTE spin. T is a time warp: rewind 2.5 seconds, once per half. Shooting assist (options) nudges close shots on target.'],
 ['SET PIECES','Throw-ins and corners: Space short, X long, C to a teammate. Pick corner and free-kick routines for each team on the tactics board. Fouls give free kicks; in the box a penalty. Cards: a second yellow or a nasty foul is a red and the team plays a man down. Injuries (option) can follow a heavy foul or hit a very tired player: a sub comes on automatically, or you play a man down if none are left. Goals are replayed from three cameras, and the result shows the man of the match. Spectate with WATCH MATCH (press F for 2x or 4x speed); leave the title menu alone for a while and a demo match plays. EDIT PLAYERS and KIT EDITOR change names, numbers, ratings and colours and are saved on this device. Football extras: derby goals can set off flares and smoke, a streaker can be caught by your players, and the dog may run off with the ball. TELETEXT shows the table, fixtures, cup, scorers and news. Press F9 (or use the pause menu) to save a screenshot as a PNG. The Amstrad boot screen can be turned off in the options. TEAMS on the main menu switches between the Greek clubs and eight 1980s national teams (separate tables, scorers and saves). Every finished match gives a Panini pack for the album. The commentator booth adds a second voice and catchphrases. A team reduced to two players (keeper included) forfeits the match 3-0.'],
 ['PENALTY SHOOTOUT AND CUP','Penalty shootout (main menu): steer up and down to aim, hold Space to charge, release to shoot. Defending, steer a direction and press Space to dive. The Penalty Cup is a knockout of eight clubs decided on penalties; watch the NERVES bar, high nerves make your aim wobble.'],
 ['TRAINING AND CHALLENGES','Training (main menu): finishing with corner targets, free kicks over a wall, and a skills arena against three defenders. Daily challenge: a fresh scenario each day, with share codes for friends and a custom challenge builder.'],
 ['NEW IN 3.4','ADVANTAGE RULE: after a foul the referee may play on while the fouled team keeps the ball; if they lose it, play comes back for the free kick. MOMENTUM METER: a bar by the score shows who is on top, and with BAR + EFFECTS the dominant side is a little quicker and the crowd gets louder. SUNSET MATCHES: dusk games fade to night and the floodlights come on. On a SNOW pitch it snows and the lines slowly disappear until half time. SUBSTITUTES WARM UP on the touchline and celebrate your goals.'],
 ['NEW IN 4.5','CONTROLS SCREEN: a teletext-style page (KEYS AND OPTIONS, or the pause menu) showing a keyboard for each player or a PlayStation-style pad. Pick any key or button and give it one job when you have the ball (ATTACK) and another when you do not (DEFENCE), for example PASS in attack and PRESS in defence. Arrows or taps select, A and D change the attack and defence jobs, C clears, R resets, Tab switches player 1, player 2 and pad. Movement keys stay in PLAYER KEYS. The job is fixed at the moment you press, so a held button does not change halfway through a shot.'],
 ['NEW IN 4.4.1','WEST GERMANY replaces Germany in the nations set. SUBSTITUTES can now be renamed in EDIT PLAYERS (scroll the PLAYER row past the five starters) for every club and nation. COMMENTARY now sits at the very bottom of the screen; the pause menu has COMMENTARY (OFF, TEXT, TEXT + VOICE) and COMMENTARY POSITION (BOTTOM or ABOVE HINTS), and F2 toggles commentary on and off during play.'],
 ['NEW IN 4.4','FREE PLAY in Training: one player on an empty pitch with a ball you can reset (R), plus add or remove opponents and teammates from the pause menu. STREET FOOTBALL (main menu): 3-a-side on the park with walls all round, no offside or fouls, first to 3, 5, 7 or 10; one player, co-op or two players. TOURNAMENT BUILDER: 4 or 8 teams, straight knockout or groups then knockout, extra time or straight to penalties; play your own matches (one player or co-op) while the computer plays the rest. CO-OP PLAYER 2 now works in Campaign and Quick Challenges. PHOTO MODE (pause menu): pan, zoom and save a screenshot with no HUD. NAMED REFEREES with personalities appear in the programme, commentary and press conference. TOUCH: new TRAP button for the offside trap and free-kick wall size; GAMEPAD: new OFFSIDE TRAP button in the remap list.'],
 ['NEW IN 4.3','CAPTAIN: after conceding (and at half-time when behind) the captain rallies the team with extra stamina and momentum, and the armband passes to a teammate if he is sent off. TOUCHLINE MANAGERS shout instructions that match the team style, and CPU managers can react after a goal against. SEASON REEL in the main menu keeps your last 8 goals and replays them. COLOUR VISION option: CLEAR KITS or HIGH CONTRAST recolours both teams and adds a circle or square under each player.'],
 ['NEW IN 4.2','DRAG BACK and ROULETTE skill moves (steer backwards or diagonally backwards with SKILL). Club chants now show their words and come back after home goals. Commentary remembers wasted shots and keeper saves. Replays gain a SCORER CAM. Import a BADGE for each club in the KIT EDITOR. STADIUM EDITOR in KEYS AND OPTIONS: stand and board colours, board text, pitch pattern and stadium name. PLAYER STATS in the main menu keeps goals, assists, shots, ball wins and distance per player. ONLINE: the host can ADD A SPECTATOR from the pause menu, and a friend can WATCH A MATCH.'],
 ['NEW IN 4.0','BOSS KEY: press ` (backquote) or F8 to hide the game behind a work screen, pausing and muting it. Same key returns. Set your own screenshot in KEYS AND OPTIONS, BOSS KEY SETUP. SMART CPU (option CLUB PERSONALITIES): each club has a style, and the CPU adapts when 2 goals down or up. OFFSIDE TRAP: press G (player 2: Y) to push your defence up in a line. When defending a free kick, G changes the wall size. QUICK FREE KICK: take it before the wall settles and the defence is caught. CAMPAIGN: ten chapters from the main menu. INSTALL AS AN APP in KEYS AND OPTIONS.'],
 ['NEW IN 3.9','HEADER DUELS: when two players jump for the same ball the better timed jump wins; a JUMP cue appears over your player when a high ball is close (green = right moment). PUDDLES in the rain slow the ball and players (option PUDDLES IN THE RAIN). MATCH SUMMARY (result screen, and SUMMARY + HEAT MAP in match stats) shows bars, possession heat maps and key moments. New stick options: TOUCH STICK DEAD ZONE, TOUCH DIAGONALS and PAD STICK DEAD ZONE.'],
 ['NEW IN 3.8','TOUCH: THRU and PRESS buttons (option EXTRA TOUCH BUTTONS). ONE-BUTTON MODE: tap KICK to pass, hold to shoot; KICK also switches or tackles when defending. CONTROLS HELP in the pause menu. STAMINA AND CARD STRIP under the score. SUBTITLE SIZE and TIME. CONTROL HINTS show the keys at the start of a match. MATCH INTRO FULL, SHORT or SKIP. In MATCHDAY OPTIONS: SEARCH OPTIONS, PIN FAVOURITE OPTIONS (pinned options move to the top) and EXPORT / IMPORT SETTINGS codes to move your setup between devices.'],
 ['NEW IN 3.7','TUTORIAL (main menu or training): 17 guided lessons with checklists - moving, shooting, curl, chip, passing, through balls, one-two, lobs, skills, switching, jockey, tackling, pressing and the pause menu. ENTER skips a lesson. PLAY AGAIN on the main menu and REMATCH after a match replay the last setup. SOUND MIXER (options) sets music, crowd, effects and commentary levels separately. The match pauses by itself when you switch away (option PAUSE WHEN SWITCHED AWAY).'],
 ['NEW IN 3.6','THROUGH BALL (B): a pass into the space ahead of a runner. ONE-TWO: tap PASS twice quickly - the receiver gives it straight back while you keep control and run. PRESS (N): hold while the opponent has the ball to send your two nearest team-mates to close him down (costs stamina). While charging a shot, press SKILL to choose CHIP or FINESSE (more curl). Keepers now parry hard shots, so watch for rebounds. Pause menu: PLAN lets you choose WASTE TIME or ALL OUT for each human team; the computer also plays out late leads and chases when behind.'],
 ['NEW IN 3.3','PLAYER SWITCHING (options): nearest to the ball, ball direction (looks where the ball is heading) or manual. Press PASS while defending to switch by hand. SWITCH SPEED sets how eagerly the computer swaps players. INPUT BUFFER remembers a kick, pass or lob pressed a moment before the ball reaches you. GAMEPAD BUTTONS (keys and options) lets you remap every pad button and has two presets; the time warp now works from the pad.'],
 ['NEW IN 3.1','Hold X while defending to JOCKEY: your player shadows the ball carrier and stays between him and goal. AIM GUIDE shows the shot path (off on MASTER). CURL POWER and CURL TRAIL make steered shots bend more and show a trail. Tactics board: DRAW TEAM FORMATION lets you drag your four outfield players. In training, pause for the SHOT MAP. Fog, moths under the floodlights, linesman flag with offside line.'],
 ['NEW IN 2.0','Quick Challenges (main menu) award bronze, silver and gold medals. Set Piece Designer (main menu, option SET PIECE DESIGNER): draw where your computer-controlled players run at corners and free kicks. Options: RAIN DELAYS (referee inspects the pitch in storms), BROADCAST MODE (TV graphics and a tighter camera), PRE-MATCH TUNNEL (handshakes and coin toss). Visiting fans fill one end of the stand.'],
 ['ONLINE','One player hosts and sends a code, the other joins and sends a reply code. The host runs the match; the joiner plays the second team with their own keys. Press Esc twice to leave.'],
 ['SUPER LEAGUE','The eight clubs play home and away, 14 rounds, with a saved table, a champions trophy and a title count. Derbies (Panathinaikos v Olympiakos, Aris v PAOK, the Athens derbies and AEK v PAOK) have flares, more fouls and cards, and a banner.'],
 ['RED CARDS AND FITNESS','A second yellow or a nasty foul sends a player off and the team plays a man down. In the Super League a sent-off club loses its star player next match, and fitness drops over a busy season (see the FIT column in the table).'],
 ['MANAGING YOUR TEAM','Pause the match (or half time) and use SUBS to swap a tired or booked player: 3 per match. The tactics board sets formation, style, corners and free kicks. Rivalry history keeps head-to-head records; a heavy defeat sets up a REVENGE MATCH. Derbies have flares, more fouls and cards.'],
 ['TOUCH CONTROLS','Drag on the left of the screen for a floating joystick (or pick the d-pad). Flick on the right to shoot: a longer flick is a harder shot. Use the LOB, PASS, SKILL, WARP and KICK buttons; size and vibration are in the options. Drag in menus to scroll.'],
 ['MENUS AND KEYS','P or H opens the pause menu, M changes sound. Penalty shootout and cup are in the main menu. Kick-off, keys, teams, colours, balls and rules presets are set in the menus. The tactics board also picks a captain (armband, fewer cards) and the penalty and free-kick takers. In league and cup matches the home side gets a small crowd boost, and the crowd wears the home club colours, chants and roars at goals. Matchday options include offsides, fouls, penalties, invaders, weather events, referee and commentary.']];
function wrapTxt(t,n){const w=t.toUpperCase().split(' '),o=[];let l='';for(const x of w){if((l+' '+x).trim().length>n){o.push(l);l=x}else l=(l+' '+x).trim()}if(l)o.push(l);return o}

function shuffled(){
  const a=[0,1,2,3,4,5,6,7];
  for(let i=7;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function newTour(kind,order){
  const t={kind,order:order||shuffled(),fx:[],ctl:2,fat:Array(8).fill(0),susp:Array(8).fill(0),out:Array(8).fill(null)};
  if(kind==='cup'){
    const o=t.order;
    for(let i=0;i<4;i++)t.fx.push({a:o[i*2],b:o[i*2+1],round:0,leg:1});
    for(let i=0;i<4;i++)t.fx.push({a:o[i*2+1],b:o[i*2],round:0,leg:2});
    t.fx.push({a:null,b:null,round:1,leg:1},{a:null,b:null,round:1,leg:1},{a:null,b:null,round:1,leg:2},{a:null,b:null,round:1,leg:2},{a:null,b:null,round:2,leg:0});
  }else{
    const tm=[0,1,2,3,4,5,6,7];
    for(let r=0;r<7;r++){
      for(let i=0;i<4;i++)t.fx.push({a:tm[i],b:tm[7-i],round:r});
      tm.splice(1,0,tm.pop());
    }
    t.fx.slice().forEach(f=>t.fx.push({a:f.b,b:f.a,round:f.round+7}));
  }
  t.fx.forEach(f=>{f.done=false;f.ga=0;f.gb=0;f.pw=-1});
  return t;
}
function tourOf(kind){
  if(kind==='cup')return Tcup||(Tcup=newTour('cup'));
  if(!Tleague){
    let c='';try{c=localStorage.getItem('kickoff6128-league'+sfx())||''}catch(e){}
    if(c&&loadCode(c))loadExtras(Tleague);else Tleague=newTour('league');
  }
  return Tleague;
}
function saveTour(t){
  try{localStorage.setItem('kickoff6128-'+t.kind+sfx(),tourCode(t));if(t.kind==='league')localStorage.setItem('kickoff6128-league-x'+sfx(),JSON.stringify({fat:t.fat,susp:t.susp,out:t.out}))}catch(e){}
}
function loadExtras(t){
  try{
    const x=JSON.parse(localStorage.getItem('kickoff6128-league-x'+sfx())||'null');
    if(x&&Array.isArray(x.fat)&&x.fat.length===8&&Array.isArray(x.susp)&&x.susp.length===8){t.fat=x.fat.map(v=>clamp(+v||0,0,1));t.susp=x.susp.map(v=>clamp(v|0,0,3));t.out=Array.isArray(x.out)&&x.out.length===8?x.out.map(o=>(o&&o.n>=1&&o.n<=3&&o.i>=1&&o.i<=4)?{n:o.n|0,i:o.i|0,nm:String(o.nm||'').slice(0,14)}:null):Array(8).fill(null)}
  }catch(e){}
}
function leagueAfter(t,f,reds,injs){
  if(!t.out)t.out=Array(8).fill(null);
  for(const c of[f.a,f.b]){if(t.susp[c]>0)t.susp[c]--;t.fat[c]=Math.min(1,t.fat[c]+.18);const o=t.out[c];if(o&&--o.n<=0)t.out[c]=null}
  for(const q of injs||[])if(!t.out[q.club])t.out[q.club]={n:1+((Math.random()*3)|0),i:q.i,nm:String(q.nm||'').slice(0,14)};
  for(let c=0;c<8;c++)if(c!==f.a&&c!==f.b)t.fat[c]=Math.max(0,t.fat[c]-.05);
  for(const c of reds)t.susp[c]=Math.min(3,t.susp[c]+1);
}
function simLeagueFixture(t,n,sk){
  const f=t.fx[n],adj=(t.fat[f.a]-t.fat[f.b])*-.9+((t.susp[f.a]>0?-.25:0)-(t.susp[f.b]>0?-.25:0))+((t.out&&t.out[f.a]?-.12:0)-(t.out&&t.out[f.b]?-.12:0));
  const r=simScore(f.a,f.b,sk,adj),note=recordResult(t,n,r[0],r[1]);h2hRec(f.a,f.b,r[0],r[1]);
  const pr=.07*(derbyOf(f.a,f.b)?1.8:1),reds=[],injs=[];
  for(const c of[f.a,f.b]){if(Math.random()<pr)reds.push(c);if(O.inj&&Math.random()<.1){const i=1+((Math.random()*4)|0);injs.push({club:c,i,nm:(ROSTER[c]&&ROSTER[c][i]&&ROSTER[c][i][0])||'PLAYER'})}}
  leagueAfter(t,f,reds,injs);
  return{r,note,reds,injs:injs.filter(q=>t.out[q.club]&&t.out[q.club].nm===q.nm.slice(0,14))};
}
function honours(){let a=[];try{a=JSON.parse(localStorage.getItem('kickoff6128-honours'+sfx())||'[]')}catch(e){}return Array.isArray(a)?a:[]}
function honoursLine(){
  const h=honours();if(!h.length)return'';
  const c={};h.forEach(i=>{c[i]=(c[i]||0)+1});
  return'TITLES  '+Object.keys(c).sort((x,y)=>c[y]-c[x]).slice(0,3).map(i=>(O.names[i]||'?').slice(0,6)+' '+c[i]).join('  ');
}
const nextFixture=t=>t.fx.findIndex(f=>!f.done&&f.a!=null&&f.b!=null);

function tieIdx(i){return i<4?[i,i+4]:i<8?[i-4,i]:i<10?[i,i+2]:i<12?[i-2,i]:[12,12]}
function tieWin(t,i2){
  const f=t.fx[i2],i1=tieIdx(i2)[0];
  if(i1===i2)return f.ga>f.gb?f.a:f.gb>f.ga?f.b:f.pw;
  const l=t.fx[i1],ax=l.ga+f.gb,ay=l.gb+f.ga;
  return ax>ay?l.a:ay>ax?l.b:f.pw;
}
function cupLevel(i,s0,s1){
  const t=tourOf('cup'),f=t.fx[i];
  if(!f||f.leg===1)return false;
  if(f.leg===2){const l=t.fx[tieIdx(i)[0]];return s0+l.gb===s1+l.ga}
  return s0===s1;
}
function recordResult(t,i,ga,gb,pw){
  const f=t.fx[i];
  f.ga=Math.min(9,ga);f.gb=Math.min(9,gb);
  if(t.kind==='cup')f.pw=pw==null?-1:pw;
  f.done=true;
  if(t.kind==='league'&&!t.fx.some(x=>!x.done)){
    const champ=standings(t)[0].i;
    if(!t.crowned){t.crowned=true;try{const h=honours();h.push(champ);localStorage.setItem('kickoff6128-honours'+sfx(),JSON.stringify(h.slice(-40)))}catch(e){}}
    return'SEASON OVER - CHAMPIONS  '+O.names[champ];
  }
  if(t.kind==='cup'){
    if(f.leg===1)return'FIRST LEG PLAYED';
    const i1=tieIdx(i)[0],l=t.fx[i1];
    if(i1!==i&&f.ga+l.gb===f.gb+l.ga&&f.pw<0)f.pw=Math.random()<.5?f.a:f.b;
    if(i1===i&&ga===gb&&f.pw<0)f.pw=Math.random()<.5?f.a:f.b;
    const w=tieWin(t,i);
    if(i>=4&&i<8){const k=i-4,j=k>>1;if(k&1){t.fx[8+j].b=w;t.fx[10+j].a=w}else{t.fx[8+j].a=w;t.fx[10+j].b=w}}
    else if(i>=10&&i<12){if(i===11)t.fx[12].b=w;else t.fx[12].a=w}
    else if(i===12)return'CHAMPIONS  '+O.names[w];
    const agg=i1!==i?'  AGG '+(f.ga+l.gb)+'-'+(f.gb+l.ga):'';
    return O.names[w]+' THROUGH'+agg+(f.pw>=0?' (PENS)':'');
  }
  return'';
}

function tourCode(t){
  const r=t.fx.map(f=>t.kind==='cup'?(f.done?''+f.ga+f.gb+(f.pw<0?'-':f.pw===f.a?'0':'1'):'---'):(f.done?''+f.ga+f.gb:'--')).join('');
  return(t.kind==='cup'?'C'+t.order.join(''):'L')+r;
}
function loadCode(code){
  code=(code||'').trim().toUpperCase();
  try{
    if(code[0]==='C'&&code.length===48){
      const order=code.slice(1,9).split('').map(Number);
      if(order.slice().sort().join('')!=='01234567')return false;
      const t=newTour('cup',order),r=code.slice(9);
      for(let i=0;i<13;i++){
        const s=r.slice(i*3,i*3+3);
        if(s==='---')continue;
        if(!/^\d\d[-01]$/.test(s)||t.fx[i].a==null||t.fx[i].b==null)return false;
        recordResult(t,i,+s[0],+s[1],s[2]==='-'?null:s[2]==='0'?t.fx[i].a:t.fx[i].b);
      }
      Tcup=t;return true;
    }
    if(code[0]==='L'&&code.length===113){
      const t=newTour('league'),r=code.slice(1);
      for(let i=0;i<56;i++){
        const s=r.slice(i*2,i*2+2);
        if(s==='--')continue;
        if(!/^\d\d$/.test(s))return false;
        recordResult(t,i,+s[0],+s[1]);
      }
      Tleague=t;return true;
    }
  }catch(e){}
  return false;
}

function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function simScore(a,b,sk,adj){
  const d=(TSK[a]-TSK[b])*(derbyOf(a,b)?.5:1)+(adj||0);
  return[Math.min(9,poisson(1.35+.3*d+.1*(sk-1))),Math.min(9,poisson(1.35-.3*d+.1*(sk-1)))];
}

function standings(t){
  const row=Array.from({length:8},(_,i)=>({i,p:0,w:0,d:0,l:0,f:0,a:0,pts:0}));
  for(const f of t.fx){
    if(!f.done)continue;
    const A=row[f.a],B=row[f.b];
    A.p++;B.p++;A.f+=f.ga;A.a+=f.gb;B.f+=f.gb;B.a+=f.ga;
    if(f.ga>f.gb){A.w++;B.l++;A.pts+=3}else if(f.ga<f.gb){B.w++;A.l++;B.pts+=3}else{A.d++;B.d++;A.pts++;B.pts++}
  }
  return row.sort((x,y)=>y.pts-x.pts||(y.f-y.a)-(x.f-x.a)||y.f-x.f||x.i-y.i);
}

function tourLines(t){
  const n=nextFixture(t);
  if(n<0){
    if(t.kind==='cup'){
      const f=t.fx[12];

    }

  }

  const dv=derbyOf(f.a,f.b),out=[t.kind==='cup'?ROUNDNAME[f.round]+(f.leg?' - LEG '+f.leg:''):'ROUND '+(f.round+1)+' OF 14',O.names[f.a]+' V '+O.names[f.b]];
  if(t.kind==='cup'&&f.leg===2){const l=t.fx[tieIdx(n)[0]];out.push('FIRST LEG  '+O.names[l.a]+' '+l.ga+' - '+l.gb+' '+O.names[l.b])}

    out.push('FITNESS '+Math.round((1-t.fat[f.a])*100)+'%  V  '+Math.round((1-t.fat[f.b])*100)+'%');
    for(const c of[f.a,f.b]){if(t.susp[c]>0)out.push(O.names[c]+' STAR SUSPENDED');const o=t.out&&t.out[c];if(o)out.push(o.nm+' ('+O.names[c]+') INJURED, '+o.n+' TO GO')}

function playFixture(t){
  const n=nextFixture(t);

  const f=t.fx[n],spec=humansFor('T',t.ctl);

function isFS(){return!!(document.fullscreenElement||document.webkitFullscreenElement)}
function toggleFS(){
  try{
    if(isFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else{const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;
      if(!f){S.msg='FULLSCREEN NOT SUPPORTED';S.msgT=90;return}
      const pr=f.call(e);if(pr&&pr.catch)pr.catch(()=>{S.msg='FULLSCREEN BLOCKED';S.msgT=90})}
  }catch(e){S.msg='FULLSCREEN BLOCKED';S.msgT=90}
}

function optsView(){
  let l=optionItems().slice();
  l.unshift(oi('GOAL REPLAYS','replay',['OFF','ON']));
  const q=S.optQ||'',fav=O.fav||[];
  if(q)l=l.filter(x=>x.label.indexOf(q)>=0);
  if(S.pinMode)return l.map(x=>x.k!=='opt'?x:{k:'act',label:(fav.includes(x.label)?'* ':'  ')+x.label+'  '+x.val(),fn:()=>{const i=O.fav.indexOf(x.label);if(i>=0)O.fav.splice(i,1);else O.fav.push(x.label);saveOpt()}});
  const pin=x=>fav.includes(x.label);
  return l.filter(pin).map(x=>Object.assign({},x,{label:'* '+x.label,val:x.val})).concat(l.filter(x=>!pin(x)));

    if(ed.kind==='code')applyCode(code,target);

    try{localStorage.setItem('kickoff6128-boss',cv2.toDataURL('image/jpeg',q));S.note='BOSS SCREEN SAVED';return true}catch(e){}
  }

}
async function bossCapture(){
  try{
    const st=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});

/* ---------- input wiring ---------- */
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='TEXTAREA')return;
  const c=e.code;
  idleT=0;
  if(c==='Backquote'||c==='F8'){e.preventDefault();bossToggle();return}
  if(S.reelOn&&S.replay){e.preventDefault();if(c==='Escape')S.hlStop=1;S.replay.i=1e9;return}
  if(bossOn){e.preventDefault();if(c==='Escape')bossToggle(false);return}
  if(c==='F9'){e.preventDefault();S.shot=1;return}
  if(S.ph){phKey(e);return}
  if(c==='F10'){e.preventDefault();clipSave();return}
  if(c==='Enter'&&S.tr&&S.tr.tut&&!S.menu.length&&S.mode==='play'){e.preventDefault();tuNext();return}
  if(S.boot){e.preventDefault();if(S.boot.t>8)S.boot=null;return}
  if(S.cc){ccKey(e);return}
  if(S.ttx){ttKey(e);return}
  if(S.cere){e.preventDefault();if(S.cere.t>40)S.cere=null;return}
  if(S.demo){e.preventDefault();endDemo();return}
  if(S.tb){tbKey(e);return}
  if(S.sm){S.sm=null;return}
  if(S.sd){sdKey(e);return}
  if(S.pg){e.preventDefault();if(S.pg.t>15)S.pg=null;return}
  if(S.wo){e.preventDefault();S.wo=null;return}
  if(S.tn){e.preventDefault();if(S.tn.t>15)S.tn=null;return}
  if(M.kind==='AI'&&S.mode==='play'&&!S.menu.length&&!HU.length&&c==='KeyF'){S.spd=S.spd===1?2:S.spd===2?4:1;return}
  if(S.edit){editKey(e);return}
  if(/^(Arrow|Space|Alt|Tab)/.test(c)||c==='Enter'||c==='Backspace')e.preventDefault();
  keys[c]=true;
  if(S.replay&&!S.menu.length){if(S.replay.hl&&c==='Escape'){S.hlStop=1;S.replay.i=1e9;return}if(c==='Enter'||c==='Space')S.replay.i=1e9;if(c!=='KeyP'&&c!=='KeyH'&&c!=='Escape')return}
  if(S.menu.length){if(!e.repeat||/^Arrow/.test(c))menuKey(c);return}
  if(e.repeat)return;
  for(const h of HU){const ea=effKey(h.slot,c,hasBall(h));if(ea==='kick')h.latch=true;else if(ea==='pass')h.psLatch=true;else if(ea==='lob')h.lLatch=true;else if(ea==='warp')warp(h);else if(ea==='skill')h.skLatch=true}
  if(S.mode==='play'&&!S.paused&&!S.tr&&!S.pso)for(const h of HU)if(effKey(h.slot,c,hasBall(h))==='trap')trapToggle(h);
  if(c==='KeyR'&&S.tr&&S.tr.drill===3&&S.mode==='play'&&!S.paused)freeBall();
  if(c==='F2'){O.comm=O.comm?0:1;if(!O.comm){S.cm=null;S.cmq=null}S.msg='COMMENTARY '+(O.comm?'ON':'OFF');S.msgT=40;saveOpt()}
  if(c==='KeyM'){O.sound=cyc(O.sound,1,3);saveOpt()}
  if(c==='KeyP'||c==='KeyH'||c==='Escape')openPause();
});
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='TEXTAREA')return;keys[e.code]=false});
function autoPause(){
  try{if(O.afk&&!S.ph&&S.mode==='play'&&!S.menu.length&&!NET.role&&!S.demo&&!S.replay&&!S.boot&&!S.cere)openPause()}catch(e){}
}
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in VIRT)VIRT[k]=false;autoPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause()});
addEventListener('paste',e=>{
  if(!S.edit||S.edit.kind!=='code')return;
  const t=((e.clipboardData&&e.clipboardData.getData('text'))||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
  S.edit.buf=(S.edit.buf+t).slice(0,80);e.preventDefault();
});
let MD=null,TJ=null,TS=null;
const joyEl=document.getElementById('joy');
function joyClear(){TJ=null;joyEl.style.display='none';VIRT.l=VIRT.r=VIRT.u=VIRT.d=false}
function playing(){return S.mode==='play'&&!S.menu.length&&!S.replay&&HU[0]&&!HU[0].net}
cv.addEventListener('pointerdown',e=>{
  idleT=0;
  if(S.boot){if(S.boot.t>8)S.boot=null;return}
  if(S.cc){ccPointer(e);return}
  if(S.ttx){ttPointer(e);return}
  if(S.cere){if(S.cere.t>40)S.cere=null;return}
  if(S.demo){endDemo();return}
  if(S.tb){tbPoint(e);return}
  if(S.sm){S.sm=null;return}
  if(S.sd){sdPoint(e);return}
  if(S.pg){if(S.pg.t>15)S.pg=null;return}
  if(S.wo){S.wo=null;return}
  if(S.tn){if(S.tn.t>15)S.tn=null;return}
  if(S.tr&&S.tr.tut&&!S.menu.length&&S.mode==='play'){const r0=cv.getBoundingClientRect();if((e.clientY-r0.top)/r0.height<.24){tuNext();return}}
  if(e.pointerType==='touch'&&playing()){
    const r=cv.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width;
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if((O.lefty?fx>.55:fx<.45)&&O.tpad===0&&!TJ){TJ={id:e.pointerId,ox:e.clientX,oy:e.clientY};joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';joyEl.style.display='block';joyEl.firstElementChild.style.transform='translate(0,0)'}
    else if((O.lefty?fx<=.55:fx>=.45)&&O.swipe&&!TS)TS={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),w:r.width};
    return;
  }
  menuPointer(e);
});
cv.addEventListener('pointermove',e=>{
  if(S.tb&&S.tb.drag){tbPoint(e,true);return}
  if(TJ&&e.pointerId===TJ.id){
    const dx=e.clientX-TJ.ox,dy=e.clientY-TJ.oy,m=Math.hypot(dx,dy)||1,k=Math.min(1,36/m);
    joyEl.firstElementChild.style.transform='translate('+dx*k+'px,'+dy*k+'px)';
    const on=m>[6,12,20][O.jdz|0],rt=[.3,.38,.5][O.jsn|0];
    VIRT.l=on&&dx<-m*rt;VIRT.r=on&&dx>m*rt;VIRT.u=on&&dy<-m*rt;VIRT.d=on&&dy>m*rt;
  }
  if(MD&&S.menu.length){
    const dy=e.clientY-MD.l;
    if(Math.abs(e.clientY-MD.y)>10)MD.moved=true;
    if(MD.moved&&Math.abs(dy)>=26){const m=S.menu[S.menu.length-1],n=buildMenu(m).items.length;m.sel=clamp(m.sel+(dy<0?1:-1),0,n-1);MD.l=e.clientY}
  }
});
function touchEnd(e){
  if(TJ&&e.pointerId===TJ.id)joyClear();
  if(TS&&e.pointerId===TS.id){
    const dx=e.clientX-TS.x,dy=e.clientY-TS.y,d=Math.hypot(dx,dy),dt=performance.now()-TS.t,h=HU[0];
    if(e.type==='pointerup'&&h&&d>36&&dt<380&&playing())h.sw={dx,dy:dy*1.5,pw:clamp(d/(TS.w*.4),.4,1),t:24};
    TS=null;
  }
  if(MD){
    const md=MD;MD=null;
    if(e.type==='pointerup'&&!md.moved&&S.menu.length&&!S.edit)menuPointer(e,true);
  }
}
cv.addEventListener('pointerup',touchEnd);cv.addEventListener('pointercancel',touchEnd);
function menuPointer(e,commit){
  if(S.replay&&!S.menu.length){S.replay.i=1e9;return}
  if(!S.menu.length||S.edit)return;
  if(e.pointerType==='touch'&&!commit){MD={y:e.clientY,l:e.clientY,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
  const r=cv.getBoundingClientRect(),lx=(e.clientX-r.left)/r.width*W,ly=(e.clientY-r.top)/r.height*H;
  const m=S.menu[S.menu.length-1],sp=buildMenu(m);
  for(const hb of S.hit||[]){
    if(lx>=hb.x&&lx<=hb.x+hb.w&&ly>=hb.y&&ly<=hb.y+hb.h){
      m.sel=hb.i;
      const it=sp.items[hb.i];
      if(it&&it.k==='opt'){it.step(lx<hb.x+hb.w*.35?-1:1);saveOpt()}else activate(it);
      beep(440,.03,'square',.02);

    }
  }
}
