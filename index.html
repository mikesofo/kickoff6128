<style>
/* Layout: one centred CRT-style screen holding the pitch, a difficulty row above it, key legend below, and a thumb pad that only appears on touch devices. Committed dark look, single theme. */
:root{
  --ink:#0c0c22; --panel:#16163d; --edge:#3a3a8c; --paper:#efeccf; --dim:#8f8fc4;
  --home:#ffd400; --away:#ff4a3d; --grass:#1c9a3e;
  --display:'Silkscreen','Courier New',monospace;
  --mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:14px;line-height:1.5;
  padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,34px);letter-spacing:.06em;line-height:1;color:var(--home);text-wrap:balance}
h1 span{color:var(--away)}
.tag{margin:6px 0 0;color:var(--dim);font-size:13px}
.diff{display:flex;gap:6px;flex-wrap:wrap}
.diff button{
  font:700 11px/1 var(--display);letter-spacing:.08em;color:var(--dim);background:var(--panel);
  border:2px solid var(--edge);padding:9px 12px;cursor:pointer;
}
.diff button[aria-pressed="true"]{color:var(--ink);background:var(--home);border-color:var(--home)}
.diff button:focus-visible,.pad button:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.screen{position:relative;border:3px solid var(--edge);background:#000;line-height:0;touch-action:manipulation}
.screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px);
}
canvas{display:block;width:100%;aspect-ratio:3/2;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0;padding:0;list-style:none;color:var(--dim);font-size:13px}
.legend li{display:flex;align-items:center;gap:8px;min-width:0}
kbd{font:500 12px/1 var(--mono);color:var(--paper);background:var(--panel);border:1px solid var(--edge);border-bottom-width:3px;padding:4px 7px}
.pad{display:none;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 16px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad button{
  font:700 18px/1 var(--display);color:var(--paper);background:var(--panel);border:2px solid var(--edge);
  width:58px;height:58px;touch-action:none;-webkit-tap-highlight-color:transparent;
}
.pad button.on{background:var(--home);color:var(--ink);border-color:var(--home)}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.pad .kick{width:104px;height:104px;font-size:15px;letter-spacing:.08em;border-color:var(--away);color:var(--away)}
.pad .kick.on{background:var(--away);color:var(--ink);border-color:var(--away)}
.fsbtn{font:700 11px/1 var(--display);letter-spacing:.08em;color:var(--dim);background:var(--panel);border:2px solid var(--edge);padding:9px 12px;cursor:pointer}
html:fullscreen body{padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
html:fullscreen .wrap{max-width:none;width:100%;gap:6px}
html:fullscreen header,html:fullscreen .legend{display:none}
html:fullscreen .screen{border-width:0;width:min(100vw,150vh);margin:0 auto}
@media (pointer:coarse){html:fullscreen .screen{width:min(100vw,calc((100vh - 200px)*1.5))}}
.nbx{position:fixed;inset:0;background:rgba(5,5,20,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.nbx[hidden]{display:none}
.nb{background:var(--panel);border:3px solid var(--edge);max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto;line-height:1.35}
.nb h3{margin:0;font:700 16px/1 var(--display);color:var(--home);letter-spacing:.06em}
.nb p{margin:0;font-size:13px;color:var(--paper)}
.nb textarea{width:100%;min-height:78px;resize:vertical;background:var(--ink);color:var(--paper);border:2px solid var(--edge);font:12px/1.3 var(--mono);padding:8px;word-break:break-all}
.nb .row{display:flex;gap:8px;flex-wrap:wrap}
.nb button{font:700 11px/1 var(--display);letter-spacing:.08em;color:var(--paper);background:var(--ink);border:2px solid var(--edge);padding:10px 14px;cursor:pointer}
.nb button:disabled{opacity:.4;cursor:default}
.nb .st{color:var(--dim);font-size:12px;min-height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pad .lob{width:70px;height:70px;font-size:13px;letter-spacing:.06em;color:var(--home);border-color:var(--home)}
.pad .lob.on{background:var(--home);color:var(--ink)}
@media (pointer:coarse){.pad{display:flex}.legend .kb{display:none}}
.pad[hidden]{display:none!important}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px}
.pad button{width:calc(58px*var(--bs,1));height:calc(58px*var(--bs,1))}
.pad .kick{width:calc(104px*var(--bs,1));height:calc(104px*var(--bs,1))}
.pad .lob{width:calc(70px*var(--bs,1));height:calc(70px*var(--bs,1))}
body.joy .dpad{display:none}
canvas{touch-action:none}
body{overscroll-behavior:none}
.rot{display:none;margin:0;color:var(--dim);font-size:12px;text-align:center}
#joy{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid rgba(255,255,255,.38);background:rgba(255,255,255,.07);display:none;pointer-events:none;z-index:9}
#joy i{position:absolute;left:30px;top:30px;width:36px;height:36px;border-radius:50%;background:rgba(255,212,0,.65)}
@media (pointer:coarse) and (orientation:portrait){.rot{display:block}}
@media (pointer:coarse) and (orientation:landscape){
  body{padding:0}
  .wrap{max-width:none;gap:0}
  header{position:fixed;top:4px;right:6px;z-index:5;gap:4px}
  header>div:first-child{display:none}
  .diff button{padding:6px 8px;opacity:.7}
  .screen{display:grid;place-items:center;height:100vh;height:100dvh}
  canvas{width:min(100vw,calc(100dvh*1.5))}
  .legend,.rot{display:none}
  .pad{position:fixed;left:0;right:0;bottom:6px;flex-wrap:nowrap;padding:0 max(10px,env(safe-area-inset-left,0px));pointer-events:none;z-index:4;opacity:.6;align-items:flex-end}
  .pad>*{pointer-events:auto}
  .acts{max-width:60vw}
  .pad{justify-content:flex-end}
  .pad button{width:calc(46px*var(--bs,1));height:calc(46px*var(--bs,1));font-size:11px}
  .pad .kick{width:calc(76px*var(--bs,1));height:calc(76px*var(--bs,1))}
  .pad .lob{width:calc(50px*var(--bs,1));height:calc(50px*var(--bs,1));font-size:10px}
  .screen{border:0!important;box-shadow:none!important}
}
@media (max-width:420px){.dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}.pad button{width:52px;height:52px}.pad .kick{width:96px;height:96px}.pad .lob{width:58px;height:58px}}
@media (prefers-reduced-motion:reduce){.screen::after{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>KICKOFF <span>6128</span></h1>
      <p class="tag">Five-a-side football. Open MENU, then INSTRUCTIONS, to learn the controls.</p>
    </div>
    <div class="diff"><button type="button" id="menubtn">MENU</button><button type="button" class="fsbtn" id="fsbtn">FULLSCREEN</button></div>
  </header>

  <div class="screen"><canvas id="c" width="1920" height="1280" aria-label="Football pitch seen from a raised angle, you play in yellow against red"></canvas></div>
  <p class="sr" id="sr" aria-live="polite"></p>

  <div class="pad" aria-label="Touch controls">
    <div class="dpad">
      <button type="button" class="u" data-k="u" aria-label="Up">&#9650;</button>
      <button type="button" class="l" data-k="l" aria-label="Left">&#9664;</button>
      <button type="button" class="r" data-k="r" aria-label="Right">&#9654;</button>
      <button type="button" class="d" data-k="d" aria-label="Down">&#9660;</button>

    <div class="acts">

    <button type="button" class="lob" data-k="s" aria-label="Pass">PASS</button>
    <button type="button" class="lob" data-k="w" aria-label="Time warp">WARP</button>
    <button type="button" class="lob" data-k="v" aria-label="Skill move">SKILL</button>
    <button type="button" class="kick" data-k="k" aria-label="Kick or slide tackle">KICK</button>
    </div>
  </div>
  <div id="joy" aria-hidden="true"><i></i></div>
  <p class="rot">Turn your phone sideways for the best view.</p>

</main>

function simKick(p,dx,dy,power,spin,lob){

  const W=windV(),pts=[];
  for(let t=1;t<=90;t++){
    x+=vx;y+=vy;
    const fr=z>.2?.996:.985+(S.wet?.0035:0)+SURF_FR[S.surf];vx*=fr;vy*=fr;
    if(z>0||vz>0){vx+=W[0]*.011;vy+=W[1]*.011;z+=vz;vz-=.13;if(z<=0)return{pts,x,y,z:0}}

    if(t%5===0)pts.push([x,y,z]);
  }
  return{pts,x,y,z};
}

function passTarget(p,fx,fy){
  let best=null,bs=-1e9;
  for(const q of players){
    if(q.tm!==p.tm||q===p)continue;
    const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
    if(d<14||d>230)continue;
    const cs=(dx*fx+dy*fy)/d;
    if(cs<.6)continue;
    let sc=cs*100-d*.1-(q.gk?45:0);
    for(const o of players){
      if(o.tm===p.tm)continue;
      const ox=o.x-p.x,oy=o.y-p.y,t=(ox*dx+oy*dy)/(d*d);
      if(t>0&&t<1&&Math.hypot(ox-t*dx,oy-t*dy)<9)sc-=40;
    }
    if(sc>bs){bs=sc;best=q}
  }
  return best;
}
function doPass(p,fx,fy){

  return q;
}

  }

}
function gkDistribute(hk,ax,ay){

function woPos(p,t){
  const side=p.tm?1:-1,i=p.i;
  const tx=CX+side*13,ty=CY-40+i*20;
  const ex=CX+side*5,ey=Y1+16+i*12;
  const t1=Math.max(0,Math.min(1,(t-i*9)/130));
  let x,y,run=1;
  if(t<150){
    const e=t1<.45?t1/.45:1;
    x=ex+(tx-ex)*Math.max(0,(t1-.45)/.55);y=ey+(Y1-14-ey)*e;
    if(t1>=.45)y=Y1-14+(ty-(Y1-14))*((t1-.45)/.55);
    if(t1>=1)run=0;
  }else if(t<230){x=tx;y=ty;run=0}
  else{
    const u=Math.min(1,(t-230)/90),v=u*u*(3-2*u);
    x=tx+(p.kx-tx)*v;y=ty+(p.ky-ty)*v;run=u<1?1:0;
  }

}

function trainSetup(){
  const T=S.tr,d=T.drill;
  reset(0);
  players=players.filter(p=>(p.tm===0&&(p.gk||p.i===4))||(p.tm===1&&(p.gk||(d>0&&p.i>=1&&p.i<=3))));
  const me=players.find(p=>p.tm===0&&!p.gk);
  HU[0].ctrl=me;HU[0].charging=false;HU[0].charge=0;HU[0].prevSp=true;
  S.sp=null;S.owner=null;S.off=null;S.pause=0;T.live=false;T.lt=0;T.own=0;lastTouch=0;
  const gl=X1,tg=[X1,CY];
  let bx,by;
  if(d===0){bx=X1-rnd(52,100);by=CY+rnd(-48,48)}
  else if(d===1){bx=X1-rnd(66,84);by=CY+rnd(-34,34)}
  else{bx=X0+70;by=CY+rnd(-30,30)}
  ball.x=bx;ball.y=by;ball.vx=ball.vy=ball.sp=ball.z=ball.vz=0;
  let ux=tg[0]-bx,uy=tg[1]-by;const ul=Math.hypot(ux,uy)||1;ux/=ul;uy/=ul;
  me.x=bx-ux*10;me.y=by-uy*10;me.fx=ux;me.fy=uy;me.vx=me.vy=0;
  const mk=players.filter(p=>p.tm===1&&!p.gk);
  mk.forEach((p,k)=>{
    p.vx=p.vy=0;
    if(d===1){p.wall=true;p.x=bx+ux*18+(-uy)*(k-1)*7;p.y=by+uy*18+ux*(k-1)*7;p.fx=-ux;p.fy=-uy}
    else{p.wall=false;p.x=bx+70+k*8;p.y=CY+(k-1)*34;p.fx=-1;p.fy=0}
  });
  for(const p of players)if(p.gk){p.x=p.hx;p.y=CY;p.vx=p.vy=0;p.dive=null;p.hold=0}
  cam=ball.x;
}
function trainEnd(msg,good){
  const T=S.tr;if(!T||T.over)return;
  T.live=false;T.streak=good?T.streak+1:0;T.best=Math.max(T.best,T.streak);
  S.msg=msg;S.msgT=60;S.pause=55;S.after=trainSetup;T.over=true;
}
function trainBounds(){
  const T=S.tr,b=ball;
  if(b.x>X1&&Math.abs(b.y-CY)<GH&&b.z<20){
    const corner=Math.abs(b.y-CY)>GH*.5,high=b.z>9,pts=(corner&&high)?3:(corner||high)?2:1;
    T.goals++;T.pts+=pts;S.shake=pts+2;cheer();
    trainEnd(pts===3?'TOP BINS! +3':pts===2?'NICE ONE! +2':'GOAL! +1',true);
    return;
  }
  if(b.x<X0||b.x>X1||b.y<Y0||b.y>Y1)trainEnd('MISSED',false);
}
function trainStep(){
  const T=S.tr;if(!T)return;
  if(S.pause>0)return;
  T.over=false;
  for(const w of players)if(w.wall&&ball.z<15){
    const dx=ball.x-w.x,dy=ball.y-w.y,dd=Math.hypot(dx,dy)||1;
    if(dd<4.6){
      const nx=dx/dd,ny=dy/dd;ball.x=w.x+nx*4.7;ball.y=w.y+ny*4.7;
      const dot=ball.vx*nx+ball.vy*ny;
      if(dot<0){ball.vx=(ball.vx-1.6*dot*nx)*.55;ball.vy=(ball.vy-1.6*dot*ny)*.55}
    }
  }
  const gk=players.find(q=>q.gk&&q.tm===1);
  if(T.live){
    T.lt++;
    const sp=Math.hypot(ball.vx,ball.vy);
    if(gk&&gk.hold>0&&gk.hold<=2)trainEnd('SAVED!',false);
    else if(T.lt>40&&sp<.15)trainEnd('MISSED',false);
    else if(T.lt>420)trainEnd('MISSED',false);
  }else if(T.drill===2&&S.owner&&S.owner.tm===1){
    if(++T.own>45)trainEnd('TACKLED!',false);
  }else T.own=0;
}

}

/* ---------- daily challenge ---------- */
function dateKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function dcDesc(d){
  const a=d.sc[0],b=d.sc[1];
  let t=a===b?'LEVEL AT '+a+'-'+b:a>b?'LEADING '+a+'-'+b:'TRAILING '+a+'-'+b;
  if(d.down<0)t+=', ONE MAN DOWN';else if(d.down>0)t+=', OPPONENT ONE MAN DOWN';
  return t+', 75 SECONDS LEFT';
}
function dcEncode(d){
  const f=[d.c0,d.c1,d.sc[0],d.sc[1],d.want==='WIN'?0:1,d.down+1,d.surf,d.wea,d.tod];
  return 'C'+f.join('')+(f.reduce((x,y)=>x+y,0)%10);
}
function dcDecode(code){
  const m=/^C(\d)(\d)(\d)(\d)(\d)(\d)(\d)(\d)(\d)(\d)$/.exec((code||'').trim().toUpperCase());
  if(!m)return null;
  const f=m.slice(1,10).map(Number);
  if(f.reduce((x,y)=>x+y,0)%10!==+m[10])return null;
  const [c0,c1,s0,s1,w,dn,surf,wea,tod]=f;
  if(c0>7||c1>7||c0===c1||w>1||dn>2||surf>3||wea>3||tod>2)return null;
  const d={c0,c1,ty:0,sc:[s0,s1],want:w?'DRAW':'WIN',down:dn-1,surf,wea,tod,custom:true};
  d.desc=dcDesc(d);return d;
}
function copyText(t){

  S.note='COPIED  '+t.slice(0,40);
}
let CC={c0:0,c1:1,s0:0,s1:1,want:0,down:0,surf:0,wea:0,tod:0};
function ccSpec(){
  const d={c0:CC.c0,c1:CC.c1,ty:0,sc:[CC.s0,CC.s1],want:CC.want?'DRAW':'WIN',down:CC.down-1,surf:CC.surf,wea:CC.wea,tod:CC.tod,custom:true};
  d.desc=dcDesc(d);return d;
}
function dcSpec(){
  let a=dateKey()>>>0;const r=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
  const c0=Math.floor(r()*8);let c1=Math.floor(r()*8);if(c1===c0)c1=(c1+1)%8;
  const ty=Math.floor(r()*3),surf=Math.floor(r()*4),wea=Math.floor(r()*4),tod=Math.floor(r()*3);
  let sc,want,down,desc;
  if(ty===0){const d=1+(r()<.4?1:0);sc=[0,d];want=d===1?'WIN':'DRAW';down=r()<.5?1:-1;desc='TRAILING '+d+'-0 WITH 75 SECONDS LEFT'}
  else if(ty===1){sc=[1,0];want='DRAW';down=0;desc='HOLD A 1-0 LEAD, ONE MAN DOWN'}
  else{sc=[1,1];want='WIN';down=r()<.4?1:-1;desc='LEVEL AT 1-1, FIND A WINNER'}
  if(ty===1)down=-1;
  return{c0,c1,ty,sc,want,down,surf,wea,tod,desc:dcDesc({sc,down})};
}
function dcLoad(){let x={};try{x=JSON.parse(localStorage.getItem('kickoff6128-daily')||'{}')||{}}catch(e){}return x}

}
function dcEnd(){
  const d=S.dc,a=S.score[0],b=S.score[1],ok=d.want==='WIN'?a>b:a>=b;

function chunk(str,n){const o=[];for(let i=0;i<str.length;i+=n)o.push(str.slice(i,i+n));return o}

function finishFixture(a,b,pw){
  if(M.teams&&!S.tr&&M.kind!=='AI')h2hRec(M.teams[0],M.teams[1],a,b);
  const n0=O.names[M.teams[0]],n1=O.names[M.teams[1]],lines=[n0+'  '+a+' - '+b+'  '+n1];
  if(M.kind==='cup'||M.kind==='league'){
    const t=tourOf(M.kind),pwv=pw!=null?pw:S.tpw,note=recordResult(t,M.fx,a,b,pwv);
    if(S.et)lines.push('AFTER EXTRA TIME');
    if(pwv!=null&&pwv>=0)lines.push('WON ON PENALTIES  '+O.names[pwv]);
    if(note)lines.push(note);
    if(note&&/^(SEASON OVER - )?CHAMPIONS/.test(note)&&!S.demo){const ci=O.names.findIndex(n=>note.endsWith(n));if(ci>=0)cereStart(ci,M.kind==='cup'?'CUP WINNERS':'LEAGUE CHAMPIONS')}
    if(M.kind==='league'){
      leagueAfter(t,t.fx[M.fx],S.reds,S.injL);
      if(HU.length===1&&!t.fx.some(x=>!x.done)&&standings(t)[0].i===M.teams[HU[0].team])award('champ');
      S.reds.forEach(c=>lines.push(O.names[c]+' PLAYER SENT OFF - BANNED NEXT MATCH'));
      (S.injL||[]).forEach(q=>{const o=t.out[q.club];if(o&&o.nm===String(q.nm).slice(0,14))lines.push(q.nm+' ('+O.names[q.club]+') INJURED - OUT '+o.n+(o.n>1?' MATCHES':' MATCH'))});
    }
    lines.push('SAVE CODE');
    chunk(tourCode(t),30).forEach(s=>lines.push(s));
    saveTour(t);
  }
  return lines;
}

function achEnd(){
  if(HU.length!==1||NET.role||S.tr||S.pso)return;
  const ht=HU[0].team,me=S.score[ht],op=S.score[1-ht];
  if(me>op){
    if(op===0)award('clean');
    if(S.derby&&me-op>=3)award('derby');
    if((S.maxdef||0)>=2)award('comeback');
    if(S.surf===1)award('mud');
    if(S.surf===3)award('ice');
  }
}
function fullTime(){

  if(S.fnote){lines.splice(1,0,'MATCH FORFEITED: '+S.fnote+' HAD TOO FEW PLAYERS (3-0)');S.fnote=null}

  if(S.pyroN>0&&S.hm>=0&&M.teams)lines.splice(2,0,O.names[S.hm]+' FINED FOR FLARES'+(S.pyroN>1?' ('+S.pyroN+' INCIDENTS)':''));

  if(HU.length>=1&&!NET.role&&!S.demo&&['1P','2P','TWIN','league','cup'].includes(M.kind)&&!S.tr&&!S.dc&&!S.pso){
    const before=stkTotal(),pack=stkEarn(),nw=pack.filter(p=>p.isNew).map(p=>stkInfo(Math.floor(p.id/100),Math.floor(p.id/10)%10,p.id%10).name);

}

/* ---------- cup and league ---------- */
function shuffled(){
  const a=[0,1,2,3,4,5,6,7];
  for(let i=7;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function newTour(kind,order){
  const t={kind,order:order||shuffled(),fx:[],ctl:2,fat:Array(8).fill(0),susp:Array(8).fill(0),out:Array(8).fill(null)};
  if(kind==='cup'){
    const o=t.order;
    for(let i=0;i<4;i++)t.fx.push({a:o[i*2],b:o[i*2+1],round:0,leg:1});
    for(let i=0;i<4;i++)t.fx.push({a:o[i*2+1],b:o[i*2],round:0,leg:2});
    t.fx.push({a:null,b:null,round:1,leg:1},{a:null,b:null,round:1,leg:1},{a:null,b:null,round:1,leg:2},{a:null,b:null,round:1,leg:2},{a:null,b:null,round:2,leg:0});
  }else{
    const tm=[0,1,2,3,4,5,6,7];
    for(let r=0;r<7;r++){
      for(let i=0;i<4;i++)t.fx.push({a:tm[i],b:tm[7-i],round:r});
      tm.splice(1,0,tm.pop());
    }
    t.fx.slice().forEach(f=>t.fx.push({a:f.b,b:f.a,round:f.round+7}));
  }
  t.fx.forEach(f=>{f.done=false;f.ga=0;f.gb=0;f.pw=-1});
  return t;
}
function tourOf(kind){
  if(kind==='cup')return Tcup||(Tcup=newTour('cup'));
  if(!Tleague){
    let c='';try{c=localStorage.getItem('kickoff6128-league'+sfx())||''}catch(e){}
    if(c&&loadCode(c))loadExtras(Tleague);else Tleague=newTour('league');
  }
  return Tleague;
}
function saveTour(t){
  try{localStorage.setItem('kickoff6128-'+t.kind+sfx(),tourCode(t));if(t.kind==='league')localStorage.setItem('kickoff6128-league-x'+sfx(),JSON.stringify({fat:t.fat,susp:t.susp,out:t.out}))}catch(e){}
}
function loadExtras(t){
  try{
    const x=JSON.parse(localStorage.getItem('kickoff6128-league-x'+sfx())||'null');
    if(x&&Array.isArray(x.fat)&&x.fat.length===8&&Array.isArray(x.susp)&&x.susp.length===8){t.fat=x.fat.map(v=>clamp(+v||0,0,1));t.susp=x.susp.map(v=>clamp(v|0,0,3));t.out=Array.isArray(x.out)&&x.out.length===8?x.out.map(o=>(o&&o.n>=1&&o.n<=3&&o.i>=1&&o.i<=4)?{n:o.n|0,i:o.i|0,nm:String(o.nm||'').slice(0,14)}:null):Array(8).fill(null)}
  }catch(e){}
}
function leagueAfter(t,f,reds,injs){
  if(!t.out)t.out=Array(8).fill(null);
  for(const c of[f.a,f.b]){if(t.susp[c]>0)t.susp[c]--;t.fat[c]=Math.min(1,t.fat[c]+.18);const o=t.out[c];if(o&&--o.n<=0)t.out[c]=null}
  for(const q of injs||[])if(!t.out[q.club])t.out[q.club]={n:1+((Math.random()*3)|0),i:q.i,nm:String(q.nm||'').slice(0,14)};
  for(let c=0;c<8;c++)if(c!==f.a&&c!==f.b)t.fat[c]=Math.max(0,t.fat[c]-.05);
  for(const c of reds)t.susp[c]=Math.min(3,t.susp[c]+1);
}
function simLeagueFixture(t,n,sk){
  const f=t.fx[n],adj=(t.fat[f.a]-t.fat[f.b])*-.9+((t.susp[f.a]>0?-.25:0)-(t.susp[f.b]>0?-.25:0))+((t.out&&t.out[f.a]?-.12:0)-(t.out&&t.out[f.b]?-.12:0));
  const r=simScore(f.a,f.b,sk,adj),note=recordResult(t,n,r[0],r[1]);h2hRec(f.a,f.b,r[0],r[1]);
  const pr=.07*(derbyOf(f.a,f.b)?1.8:1),reds=[],injs=[];
  for(const c of[f.a,f.b]){if(Math.random()<pr)reds.push(c);if(O.inj&&Math.random()<.1){const i=1+((Math.random()*4)|0);injs.push({club:c,i,nm:(ROSTER[c]&&ROSTER[c][i]&&ROSTER[c][i][0])||'PLAYER'})}}
  leagueAfter(t,f,reds,injs);
  return{r,note,reds,injs:injs.filter(q=>t.out[q.club]&&t.out[q.club].nm===q.nm.slice(0,14))};
}
function honours(){let a=[];try{a=JSON.parse(localStorage.getItem('kickoff6128-honours'+sfx())||'[]')}catch(e){}return Array.isArray(a)?a:[]}
function honoursLine(){
  const h=honours();if(!h.length)return'';
  const c={};h.forEach(i=>{c[i]=(c[i]||0)+1});
  return'TITLES  '+Object.keys(c).sort((x,y)=>c[y]-c[x]).slice(0,3).map(i=>(O.names[i]||'?').slice(0,6)+' '+c[i]).join('  ');
}
const nextFixture=t=>t.fx.findIndex(f=>!f.done&&f.a!=null&&f.b!=null);

function tieIdx(i){return i<4?[i,i+4]:i<8?[i-4,i]:i<10?[i,i+2]:i<12?[i-2,i]:[12,12]}
function tieWin(t,i2){
  const f=t.fx[i2],i1=tieIdx(i2)[0];
  if(i1===i2)return f.ga>f.gb?f.a:f.gb>f.ga?f.b:f.pw;
  const l=t.fx[i1],ax=l.ga+f.gb,ay=l.gb+f.ga;
  return ax>ay?l.a:ay>ax?l.b:f.pw;
}
function cupLevel(i,s0,s1){
  const t=tourOf('cup'),f=t.fx[i];
  if(!f||f.leg===1)return false;
  if(f.leg===2){const l=t.fx[tieIdx(i)[0]];return s0+l.gb===s1+l.ga}
  return s0===s1;
}
function recordResult(t,i,ga,gb,pw){
  const f=t.fx[i];
  f.ga=Math.min(9,ga);f.gb=Math.min(9,gb);
  if(t.kind==='cup')f.pw=pw==null?-1:pw;
  f.done=true;
  if(t.kind==='league'&&!t.fx.some(x=>!x.done)){
    const champ=standings(t)[0].i;
    if(!t.crowned){t.crowned=true;try{const h=honours();h.push(champ);localStorage.setItem('kickoff6128-honours'+sfx(),JSON.stringify(h.slice(-40)))}catch(e){}}
    return'SEASON OVER - CHAMPIONS  '+O.names[champ];
  }
  if(t.kind==='cup'){
    if(f.leg===1)return'FIRST LEG PLAYED';
    const i1=tieIdx(i)[0],l=t.fx[i1];
    if(i1!==i&&f.ga+l.gb===f.gb+l.ga&&f.pw<0)f.pw=Math.random()<.5?f.a:f.b;
    if(i1===i&&ga===gb&&f.pw<0)f.pw=Math.random()<.5?f.a:f.b;
    const w=tieWin(t,i);
    if(i>=4&&i<8){const k=i-4,j=k>>1;if(k&1){t.fx[8+j].b=w;t.fx[10+j].a=w}else{t.fx[8+j].a=w;t.fx[10+j].b=w}}
    else if(i>=10&&i<12){if(i===11)t.fx[12].b=w;else t.fx[12].a=w}
    else if(i===12)return'CHAMPIONS  '+O.names[w];
    const agg=i1!==i?'  AGG '+(f.ga+l.gb)+'-'+(f.gb+l.ga):'';
    return O.names[w]+' THROUGH'+agg+(f.pw>=0?' (PENS)':'');
  }
  return'';
}

function tourCode(t){
  const r=t.fx.map(f=>t.kind==='cup'?(f.done?''+f.ga+f.gb+(f.pw<0?'-':f.pw===f.a?'0':'1'):'---'):(f.done?''+f.ga+f.gb:'--')).join('');
  return(t.kind==='cup'?'C'+t.order.join(''):'L')+r;
}
function loadCode(code){
  code=(code||'').trim().toUpperCase();
  try{
    if(code[0]==='C'&&code.length===48){
      const order=code.slice(1,9).split('').map(Number);
      if(order.slice().sort().join('')!=='01234567')return false;
      const t=newTour('cup',order),r=code.slice(9);
      for(let i=0;i<13;i++){
        const s=r.slice(i*3,i*3+3);
        if(s==='---')continue;
        if(!/^\d\d[-01]$/.test(s)||t.fx[i].a==null||t.fx[i].b==null)return false;
        recordResult(t,i,+s[0],+s[1],s[2]==='-'?null:s[2]==='0'?t.fx[i].a:t.fx[i].b);
      }
      Tcup=t;return true;
    }
    if(code[0]==='L'&&code.length===113){
      const t=newTour('league'),r=code.slice(1);
      for(let i=0;i<56;i++){
        const s=r.slice(i*2,i*2+2);
        if(s==='--')continue;
        if(!/^\d\d$/.test(s))return false;
        recordResult(t,i,+s[0],+s[1]);
      }
      Tleague=t;return true;
    }
  }catch(e){}
  return false;
}

function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function simScore(a,b,sk,adj){
  const d=(TSK[a]-TSK[b])*(derbyOf(a,b)?.5:1)+(adj||0);
  return[Math.min(9,poisson(1.35+.3*d+.1*(sk-1))),Math.min(9,poisson(1.35-.3*d+.1*(sk-1)))];
}

function standings(t){
  const row=Array.from({length:8},(_,i)=>({i,p:0,w:0,d:0,l:0,f:0,a:0,pts:0}));
  for(const f of t.fx){
    if(!f.done)continue;
    const A=row[f.a],B=row[f.b];
    A.p++;B.p++;A.f+=f.ga;A.a+=f.gb;B.f+=f.gb;B.a+=f.ga;
    if(f.ga>f.gb){A.w++;B.l++;A.pts+=3}else if(f.ga<f.gb){B.w++;A.l++;B.pts+=3}else{A.d++;B.d++;A.pts++;B.pts++}
  }
  return row.sort((x,y)=>y.pts-x.pts||(y.f-y.a)-(x.f-x.a)||y.f-x.f||x.i-y.i);
}

function tourLines(t){
  const n=nextFixture(t);
  if(n<0){
    if(t.kind==='cup'){
      const f=t.fx[12];
      return f.done?['CHAMPIONS',O.names[tieWin(t,12)]]:['NO FIXTURE READY'];
    }
    return['CHAMPIONS',O.names[standings(t)[0].i]];
  }
  const f=t.fx[n];
  const dv=derbyOf(f.a,f.b),out=[t.kind==='cup'?ROUNDNAME[f.round]+(f.leg?' - LEG '+f.leg:''):'ROUND '+(f.round+1)+' OF 14',O.names[f.a]+' V '+O.names[f.b]];
  if(t.kind==='cup'&&f.leg===2){const l=t.fx[tieIdx(n)[0]];out.push('FIRST LEG  '+O.names[l.a]+' '+l.ga+' - '+l.gb+' '+O.names[l.b])}
  if(t.kind==='cup'&&f.leg!==1)out.push('EXTRA TIME AND PENALTIES IF LEVEL');
  if(dv)out.push('* '+dv.name+' *');
  if(t.kind==='league'){
    out.push('FITNESS '+Math.round((1-t.fat[f.a])*100)+'%  V  '+Math.round((1-t.fat[f.b])*100)+'%');
    for(const c of[f.a,f.b]){if(t.susp[c]>0)out.push(O.names[c]+' STAR SUSPENDED');const o=t.out&&t.out[c];if(o)out.push(o.nm+' ('+O.names[c]+') INJURED, '+o.n+' TO GO')}
  }
  return out;
}

function playFixture(t){
  const n=nextFixture(t);
  if(n<0)return;
  const f=t.fx[n],spec=humansFor('T',t.ctl);
  const skill=t.kind==='cup'?Math.max(O.skill,[0,1,2][f.round]):clamp(O.skill+TSK[f.a]+TSK[f.b],0,2);
  M={kind:t.kind,teams:[f.a,f.b],fx:n};
  if(!spec.length&&O.cm===0){
    let r,note,reds=[];
    let q2={};
    if(t.kind==='league'){const q=simLeagueFixture(t,n,skill);q2=q;r=q.r;note=q.note;reds=q.reds}
    else{
      r=simScore(f.a,f.b,skill);let pw=null;
      if(t.kind==='cup'&&cupLevel(n,r[0],r[1]))pw=Math.random()<.5+.08*(TSK[f.a]-TSK[f.b])?f.a:f.b;
      note=recordResult(t,n,r[0],r[1],pw);h2hRec(f.a,f.b,r[0],r[1]);
    }
    const lines=[O.names[f.a]+'  '+r[0]+' - '+r[1]+'  '+O.names[f.b]];
    if(note)lines.push(note);
    reds.forEach(c=>lines.push(O.names[c]+' PLAYER SENT OFF - BANNED NEXT MATCH'));
    (q2.injs||[]).forEach(q=>{const o=t.out[q.club];lines.push(q.nm+' ('+O.names[q.club]+') INJURED - OUT '+o.n+(o.n>1?' MATCHES':' MATCH'))});
    lines.push('SAVE CODE');chunk(tourCode(t),30).forEach(s=>lines.push(s));
    saveTour(t);
    S.menu.push({id:'result',sel:0,lines,sim:true});
    return;
  }
  beginMatch([f.a,f.b],spec,skill,[0,0]);
}

      sp.lines=t.fx.map(f=>{
        const a=f.a==null?'-':O.names[f.a],b=f.b==null?'-':O.names[f.b];
        const ix=t.fx.indexOf(f);
      return['QF1','QF1','QF1','QF1','QF2','QF2','QF2','QF2','SF1','SF1','SF2','SF2','FINAL'][ix]+'  '+a.slice(0,9)+'  '+(f.done?f.ga+' - '+f.gb:'V')+'  '+b.slice(0,9)+(f.done&&f.pw>=0?' P':'');
      });
    }
    I.push({k:'act',label:'BACK',fn:back});
    break;
  }
  case'old':{
    sp.title=m.kind==='cup'?'START OLD CUP':'START OLD LEAGUE';
    sp.lines=['TYPE OR PASTE A SAVE CODE'];
    I.push(quitItem());
    I.push({k:'txt',label:'CODE',val:()=>'',fn:()=>{S.edit={kind:'code',buf:'',target:m.kind}}});
    I.push({k:'act',label:'LOAD LAST SAVE',fn:()=>{
      let c='';try{c=localStorage.getItem('kickoff6128-'+m.kind+sfx())||''}catch(e){}
      applyCode(c,m.kind);if(m.kind==='league'&&Tleague)loadExtras(Tleague);
    }});
    break;
  }
  }
  return sp;
}

function applyCode(code,kind){
  if(kind==='chal'){const d=dcDecode(code);if(d){S.note='';beginDaily(d)}else S.note='CODE NOT RECOGNISED';return}
  const ok=loadCode(code);
  S.note=ok?'CODE LOADED':'CODE NOT RECOGNISED';
  if(ok)S.menu=tourStack(kind).map(x=>Object.assign({},x));
}

function activate(it){
  if(!it)return;
  if(it.k==='opt'){it.step(1);saveOpt()}
  else if(it.fn)it.fn();
}
function back(){
  const m=S.menu[S.menu.length-1];
  if(!m)return;
  if(m.id==='pause'){resume();return}
  if(S.menu.length>1)S.menu.pop();
}
function menuKey(c){
  const m=S.menu[S.menu.length-1];
  if(!m)return;
  S.note='';
  const sp=buildMenu(m),n=sp.items.length,it=sp.items[m.sel];
  if(c==='ArrowUp'||c==='KeyW')m.sel=(m.sel+n-1)%n;
  else if(c==='ArrowDown'||c==='KeyS')m.sel=(m.sel+1)%n;
  else if(c==='ArrowLeft'||c==='KeyA'){if(it&&it.k==='opt'){it.step(-1);saveOpt()}}
  else if(c==='ArrowRight'||c==='KeyD'){if(it&&it.k==='opt'){it.step(1);saveOpt()}}
  else if(c==='Enter'||c==='Space')activate(it);
  else if(c==='Escape'||c==='Backspace')back();
  else if((c==='KeyP'||c==='KeyH')&&m.id==='pause')resume();
  else return;
  beep(440,.03,'square',.02);
}

function editKey(e){
  const ed=S.edit;
  if(e.code==='Escape'){S.edit=null;e.preventDefault();return}
  if(ed.kind==='key'){
    e.preventDefault();
    O.keys[ed.slot][ed.act]=e.code;S.edit=null;saveOpt();return;
  }
  if(e.ctrlKey||e.metaKey)return;
  e.preventDefault();
  if(e.key==='Enter'){
    if(ed.kind==='name'){O.names[ed.idx]=ed.buf.trim()||DEFNAMES[ed.idx];saveOpt()}
    if(ed.kind==='pname'){const b=ed.buf.trim();if(b)custSet(ed.c,ed.i,'nm',b);else if(CUST[ed.c]&&CUST[ed.c][ed.i]){delete CUST[ed.c][ed.i].nm;saveCust()}}
    const code=ed.buf,target=ed.target;
    S.edit=null;
    if(ed.kind==='code')applyCode(code,target);
  }else if(e.key==='Backspace')ed.buf=ed.buf.slice(0,-1);
  else if(e.key.length===1){
    if((ed.kind==='name'||ed.kind==='pname')&&/[A-Za-z0-9 .'-]/.test(e.key)&&ed.buf.length<12)ed.buf+=e.key.toUpperCase();
    if(ed.kind==='code'&&/[A-Za-z0-9-]/.test(e.key)&&ed.buf.length<80)ed.buf+=e.key.toUpperCase();
  }
}

function drawMenu(){
  const m=S.menu[S.menu.length-1],sp=buildMenu(m),n=sp.items.length;
  if(m.sel>=n)m.sel=n-1;
  const lh=12,w=sp.w||280,rowsH=sp.rows?sp.rows.length*9+6:0,linesH=sp.lines.length?sp.lines.length*10+4:0;
  const availH=(H-26)-32-(26+linesH+rowsH+10),vis=Math.min(n,Math.max(4,Math.floor(availH/lh)));
  if(m.top===undefined)m.top=0;
  if(m.sel<m.top)m.top=m.sel;
  if(m.sel>=m.top+vis)m.top=m.sel-vis+1;
  m.top=clamp(m.top,0,n-vis);
  const h=26+linesH+rowsH+vis*lh+10,x=Math.round((W-w)/2),y=Math.max(32,Math.round((H-24-h)/2+14));
  g.fillStyle='#0a0a26';g.fillRect(x,y,w,h);
  panel(x,y,w,h);
  txt(sp.title,SCX,y+7,C.home,12);
  let cy=y+26;
  for(const s of sp.lines){txt(s,SCX,cy,'#fff',8);cy+=10}
  if(sp.lines.length)cy+=4;
  if(sp.rows){
    sp.rows.forEach((r,ri)=>{
      r.forEach((cell,ci)=>txt(String(cell),x+sp.cols[ci].x,cy,ri?'#fff':C.dim,7,sp.cols[ci].al));
      cy+=9;
    });
    cy+=6;
  }
  S.hit=[];
  sp.items.forEach((it,i)=>{
    if(i<m.top||i>=m.top+vis)return;
    const sel=i===m.sel;
    if(sel){g.fillStyle=C.home;g.fillRect(x+6,cy-2,w-12,lh-1)}
    let val=it.val?String(it.val()):'';
    if(S.edit&&sel&&(it.k==='key'||it.k==='txt')){
      val=S.edit.kind==='key'?'PRESS A KEY':(S.edit.buf+(((S.t>>4)&1)?'_':' ')).slice(-20);
    }
    txt(it.label,x+12,cy,sel?'#0c0c22':'#fff',9,'left');
    if(val)txt(val,x+w-12,cy,sel?'#0c0c22':C.home,9,'right');
    S.hit.push({x:x+6,y:cy-2,w:w-12,h:lh,i});
    cy+=lh;
  });
  if(sp.stk){
    const k=sp.stk,kx=x+w-60,ky=y+8;
    g.fillStyle=k.have?'#ffd400':'#555';g.fillRect(kx-2,ky-2,50,66);
    g.fillStyle='#10102a';g.fillRect(kx,ky,46,62);
    if(k.have){
      g.fillStyle=k.kit[0];g.fillRect(kx+2,ky+2,42,26);g.fillStyle=k.kit[2];g.fillRect(kx+2,ky+2,42,3);
      g.fillStyle='#e8b088';g.beginPath();g.arc(kx+23,ky+17,7,0,6.2832);g.fill();g.fillStyle='#3a2410';g.beginPath();g.arc(kx+23,ky+14.5,7,3.14,6.2832);g.fill();
      g.fillStyle=k.kit[0];g.fillRect(kx+12,ky+24,22,5);
      txt(''+k.num,kx+23,ky+31,'#ffd400',12);
      txt(k.name.slice(0,9),kx+23,ky+46,'#fff',5);
      txt(k.team.slice(0,9),kx+23,ky+54,C.dim,4);
    }else{txt('?',kx+23,ky+16,'#777',22);txt('MISSING',kx+23,ky+50,'#777',5)}
  }
  if(sp.kp){
    const kx=x+w-34,ky=y+7;
    g.fillStyle='#000';g.fillRect(kx-1,ky-1,28,34);
    g.fillStyle=sp.kp[0];g.fillRect(kx,ky,26,15);g.fillStyle=sp.kp[1];g.fillRect(kx,ky,26,2);
    g.fillStyle=sp.kp[2];g.fillRect(kx+3,ky+15,20,8);g.fillStyle=sp.kp[3];g.fillRect(kx+3,ky+23,8,9);g.fillRect(kx+15,ky+23,8,9);
  }
  if(sp.trophy){
    const tx=x+w-22,ty=y+7;
    g.fillStyle='#8a6a00';g.fillRect(tx-1,ty+1,3,5);g.fillRect(tx+15,ty+1,3,5);
    g.fillStyle='#ffd400';g.fillRect(tx,ty,16,8);g.fillRect(tx+3,ty+8,10,2);g.fillRect(tx+6,ty+10,4,4);g.fillRect(tx+3,ty+14,10,3);
    g.fillStyle='#fff3a0';g.fillRect(tx+2,ty+1,2,6);
    g.fillStyle='#8a6a00';g.fillRect(tx+3,ty+17,10,1);
  }
  if(m.top>0)txt('^',x+w-9,y+h-9,C.dim,7);
  if(m.top+vis<n)txt('v',x+w-9,y+h-9,C.home,7);
}

/* ---------- gamepad menu navigation ---------- */
const padPrev={};
let padShown=null;
const padEl=document.querySelector('.pad');
let wl=null,tk='';
async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
function pollPads(){
  const want=S.mode==='play'&&!S.menu.length;
  const k2=O.tpad+','+O.bsz;
  if(k2!==tk){tk=k2;document.body.classList.toggle('joy',O.tpad===0);if(padEl)padEl.style.setProperty('--bs',[.8,1,1.25][O.bsz]||1)}
  if(padEl&&want!==padShown){padShown=want;padEl.hidden=!want;if(want)wake();if(!want)joyClear()}
  if(O.dev!==1)return;
  const gp=padOf(0)||padOf(1);
  if(!gp)return;
  const bt=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),ax=padAxes(gp);
  const st={ArrowUp:ax[1]<-.5||bt(12),ArrowDown:ax[1]>.5||bt(13),ArrowLeft:ax[0]<-.5||bt(14),ArrowRight:ax[0]>.5||bt(15),
    Enter:bt(0),Escape:bt(1)||bt(9)};
  for(const c in st){
    if(st[c]&&!padPrev[c]){
      if(S.menu.length&&!S.edit)menuKey(c);
      else if(S.mode==='play'&&!S.menu.length&&c==='Escape'&&bt(9))openPause();
    }
    padPrev[c]=st[c];
  }
}

/* ---------- input wiring ---------- */
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='TEXTAREA')return;
  const c=e.code;
  idleT=0;
  if(c==='F9'){e.preventDefault();S.shot=1;return}
  if(S.boot){e.preventDefault();if(S.boot.t>8)S.boot=null;return}
  if(S.ttx){ttKey(e);return}
  if(S.cere){e.preventDefault();if(S.cere.t>40)S.cere=null;return}
  if(S.demo){e.preventDefault();endDemo();return}
  if(S.wo){e.preventDefault();S.wo=null;return}
  if(M.kind==='AI'&&S.mode==='play'&&!S.menu.length&&!HU.length&&c==='KeyF'){S.spd=S.spd===1?2:S.spd===2?4:1;return}
  if(S.edit){editKey(e);return}
  if(/^(Arrow|Space|Alt|Tab)/.test(c)||c==='Enter'||c==='Backspace')e.preventDefault();
  keys[c]=true;
  if(S.replay&&!S.menu.length){if(c==='Enter'||c==='Space')S.replay.i=1e9;if(c!=='KeyP'&&c!=='KeyH'&&c!=='Escape')return}
  if(S.menu.length){if(!e.repeat||/^Arrow/.test(c))menuKey(c);return}
  if(e.repeat)return;
  for(const h of HU){if(h.keys.kick===c)h.latch=true;if((h.keys.pass||DEFKEYS[h.slot].pass)===c)h.psLatch=true;if((h.keys.lob||DEFKEYS[h.slot].lob)===c)h.lLatch=true;if((h.keys.warp||DEFKEYS[h.slot].warp)===c)warp(h);if((h.keys.skill||DEFKEYS[h.slot].skill)===c)h.skLatch=true}
  if(c==='KeyM'){O.sound=cyc(O.sound,1,3);saveOpt()}
  if(c==='KeyP'||c==='KeyH'||c==='Escape')openPause();
});
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='TEXTAREA')return;keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in VIRT)VIRT[k]=false});
addEventListener('paste',e=>{
  if(!S.edit||S.edit.kind!=='code')return;
  const t=((e.clipboardData&&e.clipboardData.getData('text'))||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
  S.edit.buf=(S.edit.buf+t).slice(0,80);e.preventDefault();
});
let MD=null,TJ=null,TS=null;
const joyEl=document.getElementById('joy');
function joyClear(){TJ=null;joyEl.style.display='none';VIRT.l=VIRT.r=VIRT.u=VIRT.d=false}
function playing(){return S.mode==='play'&&!S.menu.length&&!S.replay&&HU[0]&&!HU[0].net}
cv.addEventListener('pointerdown',e=>{
  idleT=0;
  if(S.boot){if(S.boot.t>8)S.boot=null;return}
  if(S.ttx){ttPointer(e);return}
  if(S.cere){if(S.cere.t>40)S.cere=null;return}
  if(S.demo){endDemo();return}
  if(S.wo){S.wo=null;return}
  if(e.pointerType==='touch'&&playing()){
    const r=cv.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width;
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if(fx<.45&&O.tpad===0&&!TJ){TJ={id:e.pointerId,ox:e.clientX,oy:e.clientY};joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';joyEl.style.display='block';joyEl.firstElementChild.style.transform='translate(0,0)'}
    else if(fx>=.45&&O.swipe&&!TS)TS={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),w:r.width};
    return;
  }
  menuPointer(e);
});
cv.addEventListener('pointermove',e=>{
  if(TJ&&e.pointerId===TJ.id){
    const dx=e.clientX-TJ.ox,dy=e.clientY-TJ.oy,m=Math.hypot(dx,dy)||1,k=Math.min(1,36/m);
    joyEl.firstElementChild.style.transform='translate('+dx*k+'px,'+dy*k+'px)';
    const on=m>12;
    VIRT.l=on&&dx<-m*.38;VIRT.r=on&&dx>m*.38;VIRT.u=on&&dy<-m*.38;VIRT.d=on&&dy>m*.38;
  }
  if(MD&&S.menu.length){
    const dy=e.clientY-MD.l;
    if(Math.abs(e.clientY-MD.y)>10)MD.moved=true;
    if(MD.moved&&Math.abs(dy)>=26){const m=S.menu[S.menu.length-1],n=buildMenu(m).items.length;m.sel=clamp(m.sel+(dy<0?1:-1),0,n-1);MD.l=e.clientY}
  }
});
function touchEnd(e){
  if(TJ&&e.pointerId===TJ.id)joyClear();
  if(TS&&e.pointerId===TS.id){
    const dx=e.clientX-TS.x,dy=e.clientY-TS.y,d=Math.hypot(dx,dy),dt=performance.now()-TS.t,h=HU[0];
    if(e.type==='pointerup'&&h&&d>36&&dt<380&&playing())h.sw={dx,dy:dy*1.5,pw:clamp(d/(TS.w*.4),.4,1),t:24};
    TS=null;
  }
  if(MD){
    const md=MD;MD=null;
    if(e.type==='pointerup'&&!md.moved&&S.menu.length&&!S.edit)menuPointer(e,true);
  }
}
cv.addEventListener('pointerup',touchEnd);cv.addEventListener('pointercancel',touchEnd);
function menuPointer(e,commit){
  if(S.replay&&!S.menu.length){S.replay.i=1e9;return}
  if(!S.menu.length||S.edit)return;
  if(e.pointerType==='touch'&&!commit){MD={y:e.clientY,l:e.clientY,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
  const r=cv.getBoundingClientRect(),lx=(e.clientX-r.left)/r.width*W,ly=(e.clientY-r.top)/r.height*H;
  const m=S.menu[S.menu.length-1],sp=buildMenu(m);
  for(const hb of S.hit||[]){
    if(lx>=hb.x&&lx<=hb.x+hb.w&&ly>=hb.y&&ly<=hb.y+hb.h){
      m.sel=hb.i;
      const it=sp.items[hb.i];
      if(it&&it.k==='opt'){it.step(lx<hb.x+hb.w*.35?-1:1);saveOpt()}else activate(it);
      beep(440,.03,'square',.02);
      return;
    }
  }
}
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();VIRT[k]=true;b.classList.add('on');if(k==='k'&&HU[0])HU[0].latch=true;if(k==='s'&&HU[0])HU[0].psLatch=true;if(k==='w'&&HU[0])warp(HU[0]);if(k==='v'&&HU[0])HU[0].skLatch=true};
  const off=()=>{VIRT[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off));
});
document.getElementById('menubtn').addEventListener('click',e=>{
  e.currentTarget.blur();
  if(S.mode==='play'&&!S.menu.length)openPause();
  else if(S.menu.length&&!S.edit)back();
});

S.menu=[{id:O.seen?'main':'device',sel:0}];
applySet(O.set===1?1:0);
updateHum();reset(0);
if(O.boot!==0&&!NET.role)bootStart();
requestAnimationFrame(frame);
})();
</script>
